services:
  amt-studio:
    build: .
    image: ${AMT_IMAGE:-amt-studio-web:0.3.1}
    restart: unless-stopped
    init: true
    ports:
      - "${AMT_LISTEN_ADDRESS:-127.0.0.1}:9443:9443"
    environment:
      AMT_TLS_CERT: /run/tls/server.crt
      AMT_TLS_KEY: /run/tls/server.key
    volumes:
      - amt-data:/data
      - ./tls:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.cjs"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  amt-data:
